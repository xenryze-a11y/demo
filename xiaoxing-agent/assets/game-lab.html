<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星核训练场</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#302719,#0a0d14 55%);color:#eee9dc;font:16px system-ui;min-height:100vh;padding:40px 24px}small{letter-spacing:.2em;color:#d5b777}h1{font-size:32px;margin:12px 0}p{line-height:1.8;color:#a6a9b5}.arena{position:relative;height:290px;border:1px solid #51442c;border-radius:24px;margin:26px 0;background:#111722;box-shadow:0 24px 80px #0008}.orb{position:absolute;width:78px;height:78px;border-radius:50%;border:1px solid #f4dda0;background:radial-gradient(circle at 30% 25%,#fff1bc,#c6a25e 50%,#483719);color:#19150f;font-weight:800;font-size:26px;box-shadow:0 0 30px #d3a95822}.orb:disabled{background:#293331;color:#76ad94;border-color:#507564;box-shadow:none}#a{left:20px;top:135px}#b{right:25px;top:30px}#c{right:35px;bottom:25px}#status{padding:18px;border-radius:16px;background:#171e28;border:1px solid #2c3440;min-height:60px}button.reset{margin-top:18px;padding:12px 20px;border-radius:12px;border:1px solid #685331;background:#292216;color:#e4c889}</style>
<small>XIAOXING / INTERACTION LAB</small><h1>星核训练场</h1><p>这是手机操作验证页。<br>按顺序点击 <b>01 → 02 → 03</b>，收集三枚星核。</p><div class="arena"><button aria-label="星核 01" class="orb" id="a" data-step="1">01</button><button aria-label="星核 02" class="orb" id="b" data-step="2">02</button><button aria-label="星核 03" class="orb" id="c" data-step="3">03</button></div><div role="status" id="status">等待点击星核 01</div><button class="reset" onclick="location.reload()">重新开始</button>
<script>let next=1;document.querySelectorAll('.orb').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.step);if(n!==next){document.querySelector('#status').textContent='顺序不对，请点击星核 0'+next;console.log('wrong order',n,next);return;}b.disabled=true;next++;document.querySelector('#status').textContent=next===4?'验证完成：3 / 3 星核全部收集':'已收集 '+n+' / 3，请点击星核 0'+next;console.log('collected',n);});</script></html>
